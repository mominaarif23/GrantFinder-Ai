<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%" fill="none">
    <!-- Top Circular Loop -->
    <circle cx="50" cy="36" r="22" stroke="#0A192F" stroke-width="8.5" fill="none"/>
    
    <!-- Descending Left Arc terminating in bottom-center rounded tip -->
    <path d="M 33 48 C 21 62 21 80 32 94 C 38 101 46 102 52 98" 
          stroke="#0A192F" stroke-width="8.5" stroke-linecap="round" fill="none"/>
          
    <!-- Lower Right Arc (smoothly curving down and around to the left) -->
    <path d="M 50 62 C 64 64 74 76 74 90 C 74 104 60 114 48 110" 
          stroke="#0A192F" stroke-width="8.5" stroke-linecap="round" fill="none"/>
          
    <!-- Minimalist Floating Node / Period Dot -->
    <circle cx="77" cy="14" r="6" fill="#0A192F"/>
</svg>