{% extends "base.html" %}

{% block title %}Set New Password — GrantFinder AI{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center px-4 py-12 sm:py-16">
    <div class="w-full max-w-md rounded-3xl bg-[#FFFFFF] dark:bg-[#162521] border border-[#E2E8F0]/40 dark:border-[#2D333B] p-6 sm:p-10 shadow-sm text-center relative overflow-hidden">
        <!-- Lock Shield Icon -->
        <div class="w-14 h-14 rounded-2xl bg-[#E1EBE6] dark:bg-[#181B1F] border border-[#2A5A4D]/30 dark:border-[#2A5A4D] text-[#181B1F] dark:text-[#F4E0C8] flex items-center justify-center mx-auto mb-5 shadow-xs">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
        </div>

        <h2 class="text-2xl font-extrabold text-[#111315] dark:text-[#FFFFFF] tracking-tight">Set New Password</h2>
        <p class="text-xs text-[#6B7C72] dark:text-[#95AFA4] mt-2 max-w-sm mx-auto leading-relaxed font-serif italic">
            Enter the 6-digit verification code sent to your email along with your new password.
        </p>

        <form id="resetPasswordForm" onsubmit="handleResetPasswordSubmit(event)" class="space-y-4 mt-6 text-left">
            <div>
                <label class="block text-xs font-bold text-[#111315] dark:text-[#FFFFFF] mb-1.5" for="resetEmail">
                    Registered Email Address
                </label>
                <input type="email" id="resetEmail" required value="{{ email or '' }}" placeholder="name@university.edu" 
                    class="w-full px-3.5 py-2.5 rounded-xl bg-[#F8F9FA] dark:bg-[#111315] border border-[#E2E8F0]/50 dark:border-[#2D333B] text-sm text-[#111315] dark:text-[#FFFFFF] placeholder-[#6B7C72] focus:bg-[#FFFFFF] focus:outline-none focus:border-[#2A5A4D] focus:ring-1 focus:ring-[#2A5A4D] transition min-h-[44px]">
            </div>

            <div>
                <label class="block text-xs font-bold text-[#111315] dark:text-[#FFFFFF] mb-1.5" for="resetCode">
                    6-Digit Verification Code / Token
                </label>
                <input type="text" id="resetCode" required value="{{ token or '' }}" placeholder="e.g. 123456" 
                    class="w-full px-3.5 py-2.5 rounded-xl bg-[#F8F9FA] dark:bg-[#111315] border border-[#E2E8F0]/50 dark:border-[#2D333B] text-sm font-mono tracking-widest text-[#111315] dark:text-[#FFFFFF] placeholder-[#6B7C72] focus:bg-[#FFFFFF] focus:outline-none focus:border-[#2A5A4D] focus:ring-1 focus:ring-[#2A5A4D] transition min-h-[44px]">
            </div>

            <div>
                <label class="block text-xs font-bold text-[#111315] dark:text-[#FFFFFF] mb-1.5" for="newPassword">
                    New Password (minimum 6 characters)
                </label>
                <div class="relative">
                    <input type="password" id="newPassword" minlength="6" required placeholder="••••••••" 
                        class="w-full px-3.5 py-2.5 pr-11 rounded-xl bg-[#F8F9FA] dark:bg-[#111315] border border-[#E2E8F0]/50 dark:border-[#2D333B] text-sm text-[#111315] dark:text-[#FFFFFF] placeholder-[#6B7C72] focus:bg-[#FFFFFF] focus:outline-none focus:border-[#2A5A4D] focus:ring-1 focus:ring-[#2A5A4D] transition min-h-[44px]">
                    <button type="button" id="toggleNewPwdBtn" onclick="togglePasswordVisibility('newPassword', 'toggleNewPwdBtn')" aria-label="Show password" class="absolute right-2.5 top-1/2 -translate-y-1/2 p-2 text-[#6B7C72] hover:text-[#111315] dark:hover:text-[#FFFFFF] transition focus:outline-none rounded-lg hover:bg-[#E1EBE6]/50 dark:hover:bg-[#181B1F] min-h-[40px] min-w-[40px] flex items-center justify-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-[#111315] dark:text-[#FFFFFF] mb-1.5" for="confirmNewPassword">
                    Confirm New Password
                </label>
                <div class="relative">
                    <input type="password" id="confirmNewPassword" minlength="6" required placeholder="••••••••" 
                        class="w-full px-3.5 py-2.5 pr-11 rounded-xl bg-[#F8F9FA] dark:bg-[#111315] border border-[#E2E8F0]/50 dark:border-[#2D333B] text-sm text-[#111315] dark:text-[#FFFFFF] placeholder-[#6B7C72] focus:bg-[#FFFFFF] focus:outline-none focus:border-[#2A5A4D] focus:ring-1 focus:ring-[#2A5A4D] transition min-h-[44px]">
                    <button type="button" id="toggleConfirmPwdBtn" onclick="togglePasswordVisibility('confirmNewPassword', 'toggleConfirmPwdBtn')" aria-label="Show password" class="absolute right-2.5 top-1/2 -translate-y-1/2 p-2 text-[#6B7C72] hover:text-[#111315] dark:hover:text-[#FFFFFF] transition focus:outline-none rounded-lg hover:bg-[#E1EBE6]/50 dark:hover:bg-[#181B1F] min-h-[40px] min-w-[40px] flex items-center justify-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Error and Success Feedback -->
            <div id="resetError" class="hidden p-3 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900 text-xs font-semibold text-rose-800 dark:text-rose-300"></div>
            <div id="resetSuccess" class="hidden p-3 rounded-xl bg-emerald-50 dark:bg-[#181B1F] border border-emerald-200 dark:border-[#2A5A4D] text-xs font-semibold text-emerald-800 dark:text-emerald-300"></div>

            <button type="submit" id="resetBtn" 
                class="w-full min-h-[46px] py-3 rounded-full bg-[#181B1F] hover:bg-[#111315] text-[#FFFFFF] font-bold text-sm transition shadow-xs flex items-center justify-center space-x-2 border border-[#111315]">
                <span id="resetBtnText">Reset Password & Sign In</span>
                <span id="resetSpinner" class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-[#E2E8F0]/20 dark:border-[#2D333B] text-center">
            <p class="text-xs text-[#6B7C72] dark:text-[#95AFA4]">
                Cancel reset? 
                <a href="/login" class="text-[#2A5A4D] dark:text-[#F4E0C8] font-bold hover:underline ml-1">Return to Sign In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function handleResetPasswordSubmit(e) {
    e.preventDefault();
    const form = e.target || document.getElementById('resetPasswordForm');
    if (window.GrantFinderValidator && !window.GrantFinderValidator.validateForm(form)) {
        return;
    }
    const email = document.getElementById('resetEmail').value.trim();
    const code = document.getElementById('resetCode').value.trim();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmNewPassword').value;
    const errorBox = document.getElementById('resetError');
    const successBox = document.getElementById('resetSuccess');
    const btn = document.getElementById('resetBtn');
    const btnText = document.getElementById('resetBtnText');
    const spinner = document.getElementById('resetSpinner');

    errorBox.classList.add('hidden');
    successBox.classList.add('hidden');

    if (!email || !code) {
        errorBox.innerText = 'Please provide both your email and the verification code.';
        errorBox.classList.remove('hidden');
        return;
    }

    if (newPassword.length < 6) {
        errorBox.innerText = 'Password must be at least 6 characters long.';
        errorBox.classList.remove('hidden');
        return;
    }

    if (newPassword !== confirmPassword) {
        errorBox.innerText = 'Passwords do not match. Please re-enter.';
        errorBox.classList.remove('hidden');
        return;
    }

    if (btn) btn.disabled = true;
    if (btnText) btnText.innerText = 'Updating Password...';
    if (spinner) spinner.classList.remove('hidden');

    try {
        const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: email,
                code: code,
                new_password: newPassword
            })
        });
        const data = await res.json();

        if (res.ok && data.success) {
            successBox.innerText = data.message || 'Password reset successfully! Redirecting to login...';
            successBox.classList.remove('hidden');
            showToast('Password reset successfully. Please sign in.', 'success');

            setTimeout(() => {
                window.location.href = data.redirect || '/login';
            }, 1200);
        } else {
            const msg = data.detail || data.message || 'Could not reset password. Please check your code.';
            errorBox.innerText = msg;
            errorBox.classList.remove('hidden');
            showToast(msg, 'error');
        }
    } catch (err) {
        errorBox.innerText = 'Network error while contacting server. Please try again.';
        errorBox.classList.remove('hidden');
        showToast('Network error.', 'error');
    } finally {
        if (btn) btn.disabled = false;
        if (btnText) btnText.innerText = 'Reset Password & Sign In';
        if (spinner) spinner.classList.add('hidden');
    }
}
</script>
{% endblock %}
