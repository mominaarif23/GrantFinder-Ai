name: GrantFinder AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Build, Lint & Automated Test Suite
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://jxvouadenzfxicecqeri.supabase.co' }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'sb_publishable_TmFlWjB6qeJwMMCY-NXEVQ_u2vt0j6j' }}
      APP_ENV: testing
      DEBUG: "False"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax & Bytecode Integrity Check
        run: |
          python -m compileall app/ tests/

      - name: Execute Pytest Automated Test Suite
        run: |
          pytest -v --tb=short

      - name: Pipeline Verification Status
        run: |
          echo "All automated tests passed successfully. Ready for deployment."
